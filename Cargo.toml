[package]
name = "gray-cloud"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "gray cloud — connect this terminal to your Gray Cloud machine on gray.alignment.id"

[[bin]]
name = "gray-cloud"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
